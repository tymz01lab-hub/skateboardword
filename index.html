 const w=cam.videoWidth,h=cam.videoHeight;if(!w||!h)return;
 if(bodyLayer.width!==w||bodyLayer.height!==h){bodyLayer.width=w;bodyLayer.height=h}
 bodyCtx.clearRect(0,0,w,h);bodyCtx.drawImage(result.image,0,0,w,h);
 bodyCtx.globalCompositeOperation='destination-in';bodyCtx.drawImage(mask,0,0,w,h);bodyCtx.globalCompositeOperation='source-over';
 const footY=Math.max(...leftSole.map(v=>v.y))*h;
 const standingHeight=Math.abs(p[0].y-(p[23].y+p[24].y)/2)*h*2.1;
 bodyAnchor={footX:leftSole.reduce((sum,v)=>sum+v.x*w,0)/leftSole.length,footY,scale:145/Math.max(h*.22,standingHeight)};
}
function measure(points){
 if(!points){bent=false;extended=false;return false}
 const angle=(a,b,c)=>{
 const dx=(points[a].x-points[b].x)*cam.videoWidth,dy=(points[a].y-points[b].y)*cam.videoHeight;
 const ex=(points[c].x-points[b].x)*cam.videoWidth,ey=(points[c].y-points[b].y)*cam.videoHeight;
 return Math.acos(Math.max(-1,Math.min(1,(dx*ex+dy*ey)/(Math.hypot(dx,dy)*Math.hypot(ex,ey)))))*180/Math.PI};
 const legs=[[23,25,27],[24,26,28]].filter(ids=>ids.every(i=>points[i].visibility>.55));
 if(!legs.length){bent=false;extended=false;return false}
 const knee=legs.reduce((n,ids)=>n+angle(...ids),0)/legs.length,t=performance.now();
  const legLength=Math.max(.12,Math.abs((points[27].y+points[28].y-points[23].y-points[24].y)/2));
 const stride=Math.abs(points[27].x-points[28].x)*cam.videoWidth/(legLength*cam.videoHeight);
 if(legs.length===2&&knee>143){
 if(stride>.48)extended=true;
 if(extended&&stride<.28){extended=false;propel()}
 }else extended=false;
 if(knee<142){bent=true;lastDeep=t}
 if(bent&&knee>160){if(t-lastDeep<350)jump();bent=false}
 return true;
}
function stop(){session++;stream?.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;cam.hidden=true;bodyAnchor=null;bodyCtx.clearRect(0,0,bodyLayer.width,bodyLayer.height);bent=false;extended=false;camera.textContent='내 몸으로 타기'}
camera.onclick=async()=>{
 if(stream){stop();msg.textContent='카메라 꺼짐 · 스페이스바로 탈 수 있어요.';return}
 camera.disabled=true;const id=++session;
 try{
 const acquired=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
 if(id!==session){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;cam.srcObject=stream;cam.hidden=true;await cam.play();msg.textContent='동작 인식 도구를 불러오는 중…';
 if(!window.Pose)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=base+'pose.js';s.onload=ok;s.onerror=fail;document.head.append(s)});
 if(id!==session)return;if(!model){model=new Pose({locateFile:file=>base+file});model.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:true,smoothSegmentation:true})}
 model.onResults(r=>{if(id!==session)return;compositeBody(r);const tracked=measure(r.poseLandmarks);msg.textContent=tracked&&bodyAnchor?(bent?'지금 빠르게 펴세요!':'옆으로 서서 한 발을 뒤로 밀었다 모으세요. 무릎을 굽혔다 펴면 알리!'):'뒤로 물러나 발목까지 보여 주세요.'});
 camera.textContent='카메라 끄기';camera.disabled=false;
 while(id===session){await model.send({image:cam});await new Promise(requestAnimationFrame)}
 }catch(e){if(id===session){stop();model=null;msg.textContent=e.name==='NotAllowedError'?'카메라 권한을 허용해 주세요.':'카메라와 인터넷 연결을 확인해 주세요. 스페이스바로도 탈 수 있어요.'}}
 finally{if(!stream||id===session)camera.disabled=false}
};
back.onclick=()=>{stop();camera.disabled=false;active=false;back.hidden=true;ride.hidden=true;menu.hidden=false;cards.firstChild.focus()};
</script></body></html>
