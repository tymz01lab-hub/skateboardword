</style></head><body><main>
<header><b>Jamo Skate Club</b><button id="back" hidden>글자 바꾸기 ↗</button></header>
<section id="menu"><h1>한글 스케이트파크</h1><p>타고 싶은 글자를 고르세요.</p><div class="cards" id="cards"></div></section>
<section id="selection" hidden><canvas id="holding" width="960" height="540" aria-label="선택한 보드를 손에 든 모습"></canvas><p id="choiceHint" role="status">웹캠을 켜고 한 손을 허벅지 옆으로 내려 주세요.</p><div class="choice-actions"><button id="choiceCamera">웹캠 켜기</button><button id="startRide">이 보드로 시작</button><button id="chooseAgain">다른 보드 고르기</button></div></section>

<small id="status" role="status">→ 키를 톡톡 눌러 달리고, 획 끝에서 스페이스바로 뛰세요.</small></section></main>
<script>
function arc(a,control,b){
 return Array.from({length:25},(_,i)=>{const t=i/24,u=1-t;return [u*u*a[0]+2*u*t*control[0]+t*t*b[0],u*u*a[1]+2*u*t*control[1]+t*t*b[1]]});
}
const moonRamps=[
 [[430,214],[130,214],[130,341],...arc([130,341],[307,386],[430,323]).slice(1)],
 [[605,161],[581,383]],arc([592,286],[740,307],[899,267]),
 [[1072,261],[1515,239],[1510,301],[1081,310],[1081,367],...arc([1081,367],[1310,400],[1550,354]).slice(1)]
];
const seaRamps=[
 [[130,280],[430,280],[430,381],[130,381],[130,280]],
 arc([600,300],[746,334],[910,286]),[[755,315],[755,400]],
 [[1080,260],[1520,238],[1520,301],[1090,316],[1090,370],[1560,359]]
];
const themes=[
 {word:'해',parts:'ㅎ　ㅐ',paper:'#ffad51',ink:'#a83425',paths:[[[370,90],[452,90]],[[323,130],[495,130]],Array.from({length:41},(_,i)=>[413+90*Math.cos(Math.PI+i*Math.PI/20),257+82*Math.sin(Math.PI+i*Math.PI/20)]),[[551,74],[551,369]],[[551,219],[704,219]],[[704,74],[704,369]]]},
 {word:'달',parts:'ㄷ　ㅏ　ㄹ',paths:moonRamps},
 {word:'물',parts:'ㅁ　ㅜ　ㄹ',paths:seaRamps}
];
const scene=document.querySelector('#scene'),ctx=scene.getContext('2d'),msg=document.querySelector('#status');
const hint='웹캠에 왼쪽 어깨와 신발이 보이게 옆으로 서세요. → 밀기 · 스페이스바 알리';
let theme,rails=[],rider,active=false,last=0,audio,fish=[],bent=false,flash=0,goal=0,bank=0,finished=false,finishedAt=0;
function stroke(g,path,color,width){g.beginPath();path.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function circle(g,x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
const black='#21182d',cream='#fff5d9';
Object.assign(themes[0],{paper:'#ff7854',ink:'#ffbb13',accent:'#ed286d',name:'SUN'});
Object.assign(themes[1],{paper:'#a9dbdc',ink:'#f57868',accent:'#ebad9f',name:'MOON'});
Object.assign(themes[2],{paper:'#49dccc',ink:'#fc719a',accent:'#147fa5',name:'WATER'});
function polygon(g,points,fill){g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=fill;g.fill()}
function motif(g,t,x,y,size){
 g.save();g.translate(x,y);g.scale(size,size);g.rotate(-.12);g.lineJoin='round';
 if(t===themes[0]){
 const rays=Array.from({length:36},(_,i)=>{const a=i*Math.PI/18,r=i%2?62:85;return [Math.cos(a)*r,Math.sin(a)*r]});
 polygon(g,rays,t.ink);g.strokeStyle=black;g.lineWidth=4;g.stroke();circle(g,0,0,49,black);circle(g,-2,-3,45,t.ink);
 }else if(t===themes[1]){
 g.beginPath();g.arc(0,0,69,-1.29,1.0,true);g.bezierCurveTo(-12,38,-24,-29,19,-66);g.closePath();g.fillStyle=t.ink;g.fill();g.strokeStyle=black;g.lineWidth=5;g.stroke();
 circle(g,-48,21,6,'#adc846');circle(g,-40,36,3,'#adc846');g.translate(-38,-12);g.scale(.55,.55);
 }else{
 polygon(g,[[-36,0],[-82,-45],[-72,33]],t.ink);g.strokeStyle=black;g.lineWidth=5;g.stroke();
 g.beginPath();g.ellipse(8,0,62,36,-.12,0,Math.PI*2);g.fillStyle=t.ink;g.fill();g.stroke();
 for(let i=0;i<3;i++)stroke(g,[[-25+i*12,-18],[-15+i*12,-3],[-21+i*12,16]],black,3);g.translate(38,-3);g.scale(.55,.55);
 }
 g.beginPath();g.moveTo(-27,0);g.quadraticCurveTo(-3,-32,29,-1);g.quadraticCurveTo(2,27,-27,0);g.fillStyle=cream;g.fill();g.strokeStyle=black;g.lineWidth=4;g.stroke();circle(g,3,-2,9,black);circle(g,6,-5,2,cream);g.restore();
}
const prints=[new Image(),new Image()];
const backgrounds=new Map([[themes[1],new Image()],[themes[2],new Image()]]);
function cover(g,image,x,y,w,h){
 const iw=image.videoWidth||image.naturalWidth||image.width,ih=image.videoHeight||image.naturalHeight||image.height;
 const scale=Math.max(w/iw,h/ih);
 const sw=w/scale,sh=h/scale;
 g.drawImage(image,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);
}
backgrounds.forEach((image,t)=>{
 image.onload=()=>{themes.forEach((item,i)=>paintCard(cards.children[i].firstChild.getContext('2d'),item));};
 image.src=t===themes[1]?'moon.png':'sea.png';
});

function printFor(t){return prints[t===themes[0]?0:1]}
function palette(t){
 return t===themes[0]?['#abd9da','#ee7261','#ffd164']:t===themes[1]?['#f2dec0','#27639a','#c1d74c']:['#b5d9d4','#136e89','#79dfbd'];
}
function grain(g,w,h){
 let n=783;function random(){n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296}
 g.save();for(let i=0;i<w*h/26;i++){g.globalAlpha=random()*.23;g.fillStyle=i%3?'#645443':'#fff4d6';g.fillRect(random()*w,random()*h,random()*2+.5,random()*1.8+.5)}g.restore();
}
function landscape(g,t){
 if(backgrounds.has(t))return;
 const [sky,paint]=palette(t);g.fillStyle=sky;g.fillRect(0,0,1080,450);
 // Side elevation: all distant objects share one horizontal horizon.
 g.save();g.globalAlpha=.27;
 for(let i=0;i<54;i++){let h=8+Math.abs(Math.sin(i*29))*41;g.fillStyle='#4d5d58';g.fillRect(i*22,300-h,18,h)}
 g.restore();g.fillStyle='#efe0bb';g.fillRect(0,299,1080,151);
 stroke(g,[[0,300],[1080,300]],black,2);
 for(let i=0;i<11;i++)stroke(g,[[i*108,257],[i*108,302]],'#565647',2);
 for(let y of [260,281])stroke(g,[[0,y],[1080,y]],'#656558',1);
 for(const x of [108,925]){stroke(g,[[x,168],[x,297]],'#4c4d45',3);for(let j=0;j<4;j++)circle(g,x-10+j*7,168,3.5,'#393b37')}
 // Quarter pipes frame the playable letter like the two ends of a real park.
 for(const flip of [false,true]){
 g.save();if(flip){g.translate(1080,0);g.scale(-1,1)}
 g.beginPath();g.moveTo(-2,160);g.lineTo(79,160);g.bezierCurveTo(83,255,112,333,216,347);g.lineTo(-2,347);g.closePath();g.fillStyle=paint;g.fill();g.strokeStyle=black;g.lineWidth=3;g.stroke();g.clip();
 const im=printFor(t);if(im.naturalWidth)g.drawImage(im,0,im.height*.23,im.width*.27,im.height*.4,-5,168,195,176);g.restore();
 }
 grain(g,1080,450);
}
function course(g,t){
 const [,paint,highlight]=palette(t),im=printFor(t);
 g.save();g.lineJoin='round';g.lineCap='round';
 // A deep painted fascia and a pale coping share the collision path.
 for(const path of t.paths){
   const face=new Path2D();
   path.forEach(([x,y],i)=>i?face.lineTo(x,y):face.moveTo(x,y));
   for(const [x,y] of [...path].reverse())face.lineTo(x+3,y+37);
   face.closePath();g.fillStyle=paint;g.fill(face);g.lineWidth=2.5;g.strokeStyle=black;g.stroke(face);
   stroke(g,path,black,22);stroke(g,path,paint,17);
   g.save();g.clip(face);
   if(im.naturalWidth){for(let x=180;x<840;x+=146)for(let y=45;y<445;y+=69)
     g.drawImage(im,im.width*.015,im.height*.26,im.width*.25,im.height*.32,x,y,146,69);}
   else for(let x=200;x<850;x+=29)stroke(g,[[x,420],[x+140,40]],highlight,4);
   g.restore();
   g.save();g.translate(0,-7);stroke(g,path,black,6);stroke(g,path,'#fff1cd',3.5);g.restore();
 }
 // Bolted supports carry the bottom stroke down to the concrete slab.
 const base=t.paths.at(-1);
 for(const x of [455,610]){
   const supports=base.slice(1).map((b,i)=>[base[i],b]).filter(([a,b])=>x>=Math.min(a[0],b[0])&&x<=Math.max(a[0],b[0])&&a[0]!==b[0]);
   if(!supports.length)continue;
   const y=Math.max(...supports.map(([a,b])=>a[1]+(x-a[0])*(b[1]-a[1])/(b[0]-a[0])))+37;
   if(y<427){g.fillStyle=black;g.fillRect(x,y,9,427-y);g.fillRect(x-5,426,19,3)}
 }
 g.restore();
}
function paintCard(g,t){
 g.clearRect(0,0,440,510);
 g.fillStyle='#343b36';g.fillRect(200,24,40,32);
 g.save();g.translate(220,265);g.rotate(Math.PI/2);
 drawHeldDeck(0,0,.98,g,t);g.restore();
}
let selectedTheme=null;
function chooseBoard(t){
 selectedTheme=t;theme=t;active=false;menu.hidden=true;selection.hidden=false;
 choiceHint.textContent='선택한 '+t.word+' 보드예요. 웹캠을 켜고 손을 허벅지 옆으로 내려 주세요.';
 choiceCamera.textContent=cam.srcObject?'웹캠 끄기':'웹캠 켜기';
}
function drawSelection(){
 const g=holding.getContext('2d'),w=holding.width,h=holding.height;
 g.fillStyle='#a89d87';g.fillRect(0,0,w,h);
 for(let y=0;y<h;y+=60){g.fillStyle='#8c8270';g.fillRect(0,y,w,2)}
 g.fillStyle='#736b60';g.fillRect(0,h*.85,w,h*.15);
 let hx=w*.43,hy=h*.43,scale=.65;
 if(finishPerson&&performance.now()-finishPerson.time<750){
 const p=finishPerson.points,iw=personCutout.width,ih=personCutout.height;
 const feet=Math.max(...[27,28,29,30,31,32].filter(i=>p[i].visibility>.4).map(i=>p[i].y));
 const top=Math.max(0,p[0].y-.1),bodyHeight=Math.max(.3,feet-top)*ih;
 const ratio=h*.88/bodyHeight,cx=(p[23].x+p[24].x)*iw/2;
 const ox=w*.54+cx*ratio,oy=h*.95-feet*ih*ratio;
 const place=()=>{g.translate(ox,oy);g.scale(-ratio,ratio)};
 g.save();place();g.drawImage(personCutout,0,0);g.restore();
 const wrists=[15,16].filter(i=>p[i].visibility>.5);
 if(!wrists.length){choiceHint.textContent='보드를 들 손을 카메라에 보여 주세요.';return}
 const wrist=wrists.sort((a,b)=>p[b].visibility-p[a].visibility)[0],hand=p[wrist];
 hx=ox-hand.x*iw*ratio;hy=oy+hand.y*ih*ratio;
 scale=Math.min(h*.53/436,(h*.95-hy)/436);
 scale=Math.max(.15,scale);
 g.save();g.translate(hx-28*scale,hy+205*scale);g.rotate(Math.PI/2+.07);drawHeldDeck(0,0,scale,g);g.restore();
 drawForegroundArm(p,wrist,iw,ih);g.save();place();g.drawImage(armCutout,0,0);g.restore();
 }else{
 g.save();g.translate(w*.54,h*.92);
 stroke(g,[[-27,-160],[-30,0]],'#242c33',45);stroke(g,[[28,-160],[35,0]],'#242c33',45);
 stroke(g,[[0,-322],[0,-163]],'#eee7d5',100);circle(g,0,-375,34,'#bd8a67');
 stroke(g,[[-48,-295],[-82,-205]],'#eee7d5',28);
 g.restore();
 hx=w*.54-82;hy=h*.92-205;
 g.save();g.translate(hx-20,hy+135);g.rotate(Math.PI/2+.07);drawHeldDeck(0,0,.65,g);g.restore();
 circle(g,hx,hy,12,'#bd8a67');
 }
}
startRide.onclick=()=>{selection.hidden=true;enter(selectedTheme)};
chooseAgain.onclick=()=>{selection.hidden=true;menu.hidden=false;selectedTheme=null;cards.firstChild.focus()};
choiceCamera.onclick=async()=>{const task=camera.onclick();choiceCamera.disabled=true;setTimeout(()=>{choiceCamera.disabled=false;choiceCamera.textContent=cam.srcObject?'웹캠 끄기':'웹캠 켜기'},1200);await task};
themes.forEach(t=>{
 const btn=document.createElement('button');btn.className='card';btn.innerHTML='<canvas width="440" height="510" aria-hidden="true"></canvas><span>'+t.parts+'<b>↗</b></span>';
 btn.onclick=()=>chooseBoard(t);cards.append(btn);paintCard(btn.firstChild.getContext('2d'),t);
});
prints.forEach((im,i)=>{im.onload=()=>{themes.forEach((t,k)=>paintCard(cards.children[k].firstChild.getContext('2d'),t));if(active){const g=wall.getContext('2d');landscape(g,theme);course(g,theme)}};im.src='park-print-'+(i+1)+'.jpg'});
function tone(freq,end,duration,type='triangle',volume=.16){
 if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(end,t+duration);a.gain.setValueAtTime(volume,t);a.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+duration);
}
function height(line,x){return line.a[1]+(x-line.a[0])*(line.b[1]-line.a[1])/(line.b[0]-line.a[0])-10}
function resetRide(){
 const x=theme===themes[0]?375:155;
 const line=rails.filter(l=>x>=l.a[0]&&x<=l.b[0]).sort((a,b)=>height(a,x)-height(b,x))[theme===themes[1]?1:0];
 // Start the sun run on the round stroke below its two short bars.
 const startLine=theme===themes[0]?rails.find(l=>l.path===2&&x>=l.a[0]&&x<=l.b[0]):line;
 rider={x,y:height(startLine,x),vx:0,vy:0,line:startLine};fish=[];bank=0;
}
const wall=document.createElement('canvas');
wall.width=scene.width;wall.height=scene.height;
function enter(t){
 wall.width=t===themes[0]?1080:1720;wall.height=450;
 const mural=wall.getContext('2d');landscape(mural,t);course(mural,t);
 theme=t;rails=[];t.paths.forEach((path,k)=>path.slice(1).forEach((b,i)=>{let a=path[i];if(Math.abs(b[0]-a[0])<Math.abs(b[1]-a[1])*.65)return;if(a[0]>b[0])[a,b]=[b,a];rails.push({a,b,path:k})}));
 finished=false;again.hidden=true;goal=t===themes[1]?1490:t===themes[2]?1495:Math.max(...rails.map(l=>l.b[0]))-20;resetRide();active=true;menu.hidden=true;ride.hidden=false;back.hidden=false;title.textContent=t.word;msg.textContent=hint;
 audio??=new AudioContext();audio.resume().catch(()=>{});last=performance.now();push.focus();
}
function propel(){if(!active||!rider.line)return;rider.vx=Math.min(410,rider.vx+155);tone(190,54,.12,'sawtooth',.06);if(theme===themes[2])fish.push({x:rider.x,y:rider.y,t:0})}
function jump(){if(!active||!rider.line)return;rider.line=null;rider.vy=theme===themes[1]?-423:-475;rider.vx=Math.max(240,rider.vx);tone(1320,175,.08)}
push.onclick=propel;ollie.onclick=jump;
addEventListener('keydown',e=>{if(!active||!['Space','ArrowRight'].includes(e.code))return;if(e.code==='Space'&&[camera,back].includes(document.activeElement))return;e.preventDefault();if(!e.repeat)(e.code==='Space'?jump:propel)()});
function step(dt){
 if(finished)return;
 const r=rider,oldY=r.y;r.x+=r.vx*dt;r.vx=Math.max(0,r.vx-(r.line?90:16)*dt);
 while(r.line&&r.x>r.line.b[0]){const prev=r.line;r.line=rails.find(l=>l.path===prev.path&&Math.abs(l.a[0]-prev.b[0])<.001&&Math.abs(l.a[1]-prev.b[1])<.001&&l.b[0]>prev.b[0])}
 if(r.line)r.y=height(r.line,r.x);
 if(!r.line){r.vy+=(theme===themes[1]?700:960)*dt;r.y+=r.vy*dt;
 if(r.vy>=0){const hit=rails.filter(l=>r.x>=l.a[0]&&r.x<=l.b[0]&&oldY<=height(l,r.x)+1&&r.y>=height(l,r.x)).sort((a,b)=>height(a,r.x)-height(b,r.x))[0];
 if(hit){r.line=hit;r.y=height(hit,r.x);r.vy=0;flash=.3;tone(theme===themes[0]?700:140,theme===themes[0]?290:40,.22)}}}
 if(r.line&&r.vx>30){bank+=r.vx*dt;if(bank>46){bank=0;tone(79,40,.04,'triangle',.045)}}
 if(r.x>=goal&&r.line){finished=true;finishedAt=performance.now();r.vx=0;again.hidden=false;msg.textContent=theme.word+' 완주! 데크에 그래피티를 남겼어요.'}else if(r.y>500||r.x>wall.width){resetRide();msg.textContent='다시 출발해요. 획 끝에 닿기 전에 알리!'}
 flash=Math.max(0,flash-dt);fish.forEach(f=>f.t+=dt);fish=fish.filter(f=>f.t<1);
}

function drawHeldDeck(x,y,size,g=ctx,deckTheme=theme){

 ctx.beginPath();ctx.roundRect(-218,-47,436,94,44);ctx.fillStyle='#ecd2a0';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#20252b';ctx.stroke();
 ctx.save();ctx.clip();const print=printFor(theme);
 if(print.naturalWidth)ctx.drawImage(print,0,0,print.width,print.height,-220,-95,440,195);
 ctx.fillStyle='#09222b88';ctx.fillRect(-220,-47,440,94);
 const t=Math.min(1,(performance.now()-finishedAt)/650);
 ctx.save();ctx.scale(.65+.35*t,.65+.35*t);ctx.rotate(-.08);ctx.font='italic 900 85px Malgun Gothic,sans-serif';ctx.textAlign='center';ctx.lineJoin='round';
 ctx.lineWidth=12;ctx.strokeStyle='#17212a';ctx.strokeText(theme.word,0,30);ctx.lineWidth=5;ctx.strokeStyle='#fff3ce';ctx.strokeText(theme.word,0,30);ctx.fillStyle=palette(theme)[2];ctx.fillText(theme.word,0,30);ctx.restore();ctx.restore();
 for(const x of [-135,135]){ctx.fillStyle='#c4cbca';ctx.fillRect(x-8,-24,16,48);ctx.fillStyle='#444a4d';ctx.fillRect(x-15,-12,30,24)}

}
function drawFinish(){
 ctx.setTransform(1,0,0,1,0,0);
 const image=backgrounds.get(theme),w=scene.width,h=scene.height;
 ctx.fillStyle=palette(theme)[0];ctx.fillRect(0,0,w,h);if(image?.naturalWidth)cover(ctx,image,0,0,w,h);
 ctx.fillStyle='#0004';ctx.fillRect(0,0,w,h);
 if(finishPerson&&performance.now()-finishPerson.time<750){
   const p=finishPerson.points,iw=personCutout.width,ih=personCutout.height;
   const feet=Math.max(...[27,28,29,30,31,32].filter(i=>p[i].visibility>.4).map(i=>p[i].y));
   const top=Math.max(0,p[0].y-.10),bodyHeight=Math.max(.3,feet-top)*ih;
   const scale=h*.84/bodyHeight,cx=(p[23].x+p[24].x)*iw/2;
   const originX=w*.5+cx*scale,originY=h*.94-feet*ih*scale;
   const place=()=>{ctx.translate(originX,originY);ctx.scale(-scale,scale)};
   ctx.save();place();ctx.drawImage(personCutout,0,0);ctx.restore();
   const wrists=[15,16].filter(i=>p[i].visibility>.5&&p[i].x>0&&p[i].x<1&&p[i].y>0&&p[i].y<1);
   if(wrists.length){
     const index=wrists.sort((a,b)=>p[b].visibility-p[a].visibility)[0],hand=p[index];
     const hx=originX-hand.x*iw*scale,hy=originY+hand.y*ih*scale,size=h*.84/500;
     drawHeldDeck(hx-25*size,hy-20*size,size);
     // The camera-facing arm sits in front of the deck, from elbow to fingertips.
     drawForegroundArm(p,index,iw,ih);
     ctx.save();place();ctx.drawImage(armCutout,0,0);ctx.restore();
   }else{
     ctx.fillStyle='#fff2d7';ctx.font=Math.max(13,h*.027)+'px sans-serif';ctx.textAlign='center';ctx.fillText('보드를 들 손을 허벅지 옆에 내려 주세요.',w/2,h*.10);
   }
 }else{
   const u=h/600;
   ctx.save();ctx.translate(w*.5,h*.90);ctx.scale(u,u);
   stroke(ctx,[[-30,-200],[-39,-10]],'#26353c',45);stroke(ctx,[[20,-200],[38,-10]],'#26353c',45);
   stroke(ctx,[[0,-360],[0,-202]],'#345777',100);circle(ctx,0,-414,38,'#c3916a');
   stroke(ctx,[[49,-335],[72,-212]],'#345777',31);ctx.restore();
   drawHeldDeck(w*.5+48*u,h*.90-218*u,.9*u);
   ctx.save();ctx.translate(w*.5,h*.90);ctx.scale(u,u);
   stroke(ctx,[[49,-335],[72,-212],[72,-183]],'#345777',31);
   circle(ctx,72,-180,13,'#c3916a');ctx.restore();
 }
}
again.onclick=()=>enter(theme);
function draw(){
 if(finished){drawFinish();return}

 const scale=Math.min(scene.width/530,scene.height/465);
 const viewWidth=scene.width/scale,viewHeight=scene.height/scale;
 const centerX=theme===themes[0]?Math.max(505,Math.min(rider.x,705)):Math.max(viewWidth/2,Math.min(rider.x+viewWidth*.18,wall.width-viewWidth/2));
 const top=Math.min((450-viewHeight)/2,rider.y-160);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=palette(theme)[0];ctx.fillRect(0,0,scene.width,scene.height);
 const background=backgrounds.get(theme);
 if(webcamBackdrop?.ready){ctx.save();ctx.translate(scene.width,0);ctx.scale(-1,1);cover(ctx,webcamBackdrop.image,0,0,scene.width,scene.height);ctx.restore()}
 else if(background?.naturalWidth)cover(ctx,background,0,0,scene.width,scene.height);
 ctx.setTransform(scale,0,0,scale,(viewWidth/2-centerX)*scale,-top*scale);
 ctx.drawImage(wall,0,0);
 for(const f of fish){const x=f.x+170*f.t,y=f.y-130*Math.sin(Math.PI*f.t);ctx.fillStyle='#ffdf85';ctx.beginPath();ctx.ellipse(x,y,14,6,-.2,0,7);ctx.fill();stroke(ctx,[[x-13,y],[x-21,y-4],[x-21,y+5],[x-13,y]],'#ffdf85',3)}
 const {x,y,line}=rider;ctx.save();ctx.translate(x,y);ctx.lineCap='round';
 if(line&&theme!==themes[0])ctx.rotate(Math.atan2(line.b[1]-line.a[1],line.b[0]-line.a[0]));
 if(flash){ctx.save();ctx.globalAlpha=Math.min(1,flash*6);for(const dir of [-1,1])for(let i=0;i<3;i++)stroke(ctx,[[dir*(32+i*4),-7+i*5],[dir*(48+i*8),-23+i*12]],black,3);ctx.restore()}
 {
 const h=bent||!line?10:0;stroke(ctx,[[-4,-40+h],[-16,-26],[-13,-10]],'#25282b',9);stroke(ctx,[[0,-40+h],[13,-24],[15,-10]],'#303640',10);
 stroke(ctx,[[-4,-61+h],[-3,-41+h]],'#f1e28a',19);stroke(ctx,[[0,-58+h],[12,-49+h],[22,-55+h]],'#242923',6);
 circle(ctx,0,-80+h,15,'#ad7857');
 stroke(ctx,[[-13,-92+h],[13,-93+h]],'#212924',5)}
 stroke(ctx,[[-36,-9],[-27,-6],[27,-6],[37.5,-10]],'#242723',4);circle(ctx,-21,-2,3,'#191e18');circle(ctx,21,-2,3,'#191e18');ctx.restore();
}
function frame(now){if(!selection.hidden)drawSelection();else if(active){step(Math.min(.034,(now-last)/1000));draw()}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
const base='https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';
let stream=null,session=0,model,lastDeep=0,extended=false,webcamBackdrop=null;
function makeRoomBackground(){
  const canvas=document.createElement('canvas');
  canvas.width=Math.min(cam.videoWidth,480);
  canvas.height=Math.round(canvas.width*cam.videoHeight/cam.videoWidth);
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const {width:w,height:h}=canvas;
  const history=new Uint8ClampedArray(w*h*4),seen=new Uint8Array(w*h);
  const texture={image:canvas,userData:{},ready:false};
  
  texture.userData.update=result=>{
    if(!result.segmentationMask)return;
    ctx.clearRect(0,0,w,h);ctx.drawImage(result.segmentationMask,0,0,w,h);
    const mask=ctx.getImageData(0,0,w,h).data;
    ctx.drawImage(result.image,0,0,w,h);
    const frame=ctx.getImageData(0,0,w,h),pixels=frame.data;
    for(let y=0;y<h;y++){
      let left=-1,right=0;
      const row=y*w;
      for(let x=0;x<w;x++){
        const i=row+x,k=4*i;
        if(mask[k+3]<12){
          for(let c=0;c<3;c++)history[k+c]=pixels[k+c];
          seen[i]=1;left=x;continue;
        }
        right=Math.max(right,x+1);
        while(right<w&&mask[4*(row+right)+3]>=12)right++;
        const l=left>=0?left:right,r=right<w?right:left;
        const mix=l===r?0:(x-l)/(r-l);
        for(let c=0;c<3;c++){
          pixels[k+c]=seen[i]?history[k+c]:l>=0&&l<w?
            pixels[4*(row+l)+c]*(1-mix)+pixels[4*(row+r)+c]*mix:128;
        }
      }
    }
    ctx.putImageData(frame,0,0);texture.ready=true;
  };
  return texture;
}

const personCutout=document.createElement('canvas'),personBrush=personCutout.getContext('2d');
const armCutout=document.createElement('canvas'),armBrush=armCutout.getContext('2d');
function drawForegroundArm(points,wrist,width,height){
 if(armCutout.width!==width||armCutout.height!==height){armCutout.width=width;armCutout.height=height}
 const elbow=points[wrist-2],hand=points[wrist];
 const shoulder=points[wrist-4],tip=points[wrist+4];
 const breadth=Math.max(12,Math.hypot((points[11].x-points[12].x)*width,(points[11].y-points[12].y)*height)*.28,
   Math.hypot((elbow.x-hand.x)*width,(elbow.y-hand.y)*height)*.34);
 armBrush.clearRect(0,0,width,height);
 armBrush.drawImage(personCutout,0,0);
 armBrush.globalCompositeOperation='destination-in';
 armBrush.beginPath();armBrush.moveTo(shoulder.x*width,shoulder.y*height);
 armBrush.lineTo(elbow.x*width,elbow.y*height);
 armBrush.lineTo(hand.x*width,hand.y*height);
 if(tip.visibility>.4)armBrush.lineTo(tip.x*width,tip.y*height);
 armBrush.lineWidth=breadth;armBrush.lineCap='round';armBrush.lineJoin='round';armBrush.strokeStyle='#fff';armBrush.stroke();
 armBrush.globalCompositeOperation='source-over';
}
let finishPerson=null;
function updateFinishPerson(result){
 const p=result.poseLandmarks;
 if(!p||!result.segmentationMask||p[0].visibility<.5||![27,28,29,30,31,32].some(i=>p[i].visibility>.4))return;
 const width=cam.videoWidth,height=cam.videoHeight;if(!width||!height)return;
 if(personCutout.width!==width||personCutout.height!==height){personCutout.width=width;personCutout.height=height}
 personBrush.clearRect(0,0,width,height);personBrush.drawImage(result.image,0,0,width,height);
 personBrush.globalCompositeOperation='destination-in';personBrush.drawImage(result.segmentationMask,0,0,width,height);personBrush.globalCompositeOperation='source-over';
 finishPerson={points:p,time:performance.now()};
}
function measure(points){
 if(!points){bent=false;extended=false;return false}
 const angle=(a,b,c)=>{
 const dx=(points[a].x-points[b].x)*cam.videoWidth,dy=(points[a].y-points[b].y)*cam.videoHeight;
 const ex=(points[c].x-points[b].x)*cam.videoWidth,ey=(points[c].y-points[b].y)*cam.videoHeight;
 return Math.acos(Math.max(-1,Math.min(1,(dx*ex+dy*ey)/(Math.hypot(dx,dy)*Math.hypot(ex,ey)))))*180/Math.PI};
 const legs=[[23,25,27],[24,26,28]].filter(ids=>ids.every(i=>points[i].visibility>.55));
 if(!legs.length){bent=false;extended=false;return false}
 const knee=legs.reduce((n,ids)=>n+angle(...ids),0)/legs.length,t=performance.now();
  const legLength=Math.max(.12,Math.abs((points[27].y+points[28].y-points[23].y-points[24].y)/2));
 const stride=Math.abs(points[27].x-points[28].x)*cam.videoWidth/(legLength*cam.videoHeight);
 if(legs.length===2&&knee>143){
 if(stride>.48)extended=true;
 if(extended&&stride<.28){extended=false;propel()}
 }else extended=false;
 if(knee<142){bent=true;lastDeep=t}
 if(bent&&knee>160){if(t-lastDeep<350)jump();bent=false}
 return true;
}
function stop(){session++;stream?.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;webcamBackdrop=null;finishPerson=null;cam.hidden=true;bent=false;extended=false;camera.textContent='내 몸으로 타기'}
camera.onclick=async()=>{
 if(stream){stop();msg.textContent='카메라 꺼짐 · 스페이스바로 탈 수 있어요.';return}
 camera.disabled=true;const id=++session;
 try{
 const acquired=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
 if(id!==session){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;cam.srcObject=stream;cam.hidden=true;await cam.play();webcamBackdrop=makeRoomBackground();msg.textContent='동작 인식 도구를 불러오는 중…';
 if(!window.Pose)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src=base+'pose.js';s.onload=ok;s.onerror=fail;document.head.append(s)});
 if(id!==session)return;if(!model){model=new Pose({locateFile:file=>base+file});model.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:true,smoothSegmentation:true})}
 model.onResults(r=>{if(id!==session)return;webcamBackdrop?.userData.update(r);updateFinishPerson(r);const tracked=active?measure(r.poseLandmarks):false;if(!selection.hidden){choiceCamera.textContent="웹캠 끄기";choiceHint.textContent=finishPerson?"손에 든 보드를 확인하고 이 보드로 시작을 눌러 주세요.":msg.textContent;return}if(finished)return;msg.textContent=tracked?(bent?'지금 빠르게 펴세요!':'옆으로 서서 한 발을 뒤로 밀었다 모으세요. 무릎을 굽혔다 펴면 알리!'):'뒤로 물러나 발목까지 보여 주세요.'});
 camera.textContent='카메라 끄기';camera.disabled=false;
 while(id===session){await model.send({image:cam});await new Promise(requestAnimationFrame)}
 }catch(e){if(id===session){stop();model=null;msg.textContent=e.name==='NotAllowedError'?'카메라 권한을 허용해 주세요.':'카메라와 인터넷 연결을 확인해 주세요. 스페이스바로도 탈 수 있어요.'}}
 finally{if(!stream||id===session)camera.disabled=false}
};
back.onclick=()=>{stop();camera.disabled=false;active=false;back.hidden=true;ride.hidden=true;menu.hidden=false;cards.firstChild.focus()};
